apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: studentportal
  labels:
    app: database
spec:
  serviceName: database
  replicas: 3
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
      - name: cont-database
        image: mongo:7
        ports:
        - containerPort: 27017
          name: mongo
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongo-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: studentportal
spec:
  type: ClusterIP
  selector:
    app: database
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017
    name: mongo
